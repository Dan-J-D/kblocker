[package]
name = "kblocker-gui"
version = "0.1.0"
description = "Desktop app for kblocker"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "kblocker_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
